services:
  postgres:
    container_name: aerc-surveys-stage25
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aerc_surveys
    volumes:
      - aerc-surveys-stage25-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aerc-surveys-stage25-data:
    name: aerc-surveys-stage25-data
